<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1E29" />
    <meta name="description" content="Personal gym and cardio diary" />
    <!-- iPhone "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Diary" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <title>Gym Diary</title>
    <script>
      // Apply the saved theme before first paint (avoids a flash of the wrong theme).
      try {
        var p = localStorage.getItem('gym-diary-theme') || 'dark';
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#F0EDE4' : '#0C1E29';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
